bio: |
  Yu Zhu works at the intersection of AI for Science, computational chemistry,
  and computer vision. His research spans machine learning force fields,
  physics-driven reconstruction of molecular orbitals from scanning tunneling
  microscopy images, open-set fine-grained recognition, and materials modeling.

